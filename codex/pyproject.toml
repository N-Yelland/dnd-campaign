
[project]
name = "codex"
version = "1.0.0"
description = "A Sphinx HTML theme for the Codex project."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "sphinx>=4.0",
    "sphinxcontrib-jquery"
]

[project.entry-points."sphinx.extensions"]
codex = "codex.extension:setup_extension"

[project.entry-points."sphinx.html_themes"]
codex = "codex"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
codex = ["*.html", "theme.toml", "static/**", "templates/**"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"